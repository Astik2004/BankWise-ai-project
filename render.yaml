services:
  - type: web
    name: bankwise-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: mongodb+srv://...
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: APP_OAUTH2_AUTHORIZED_REDIRECT_URI
        sync: false # e.g. https://<your-vercel-app>.vercel.app/oauth2/redirect
      - key: APP_OAUTH2_DEFAULT_REDIRECT_URI
        sync: false # e.g. https://<your-vercel-app>.vercel.app/oauth2/redirect

