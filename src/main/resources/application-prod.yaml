spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

  application:
    name: bankwise

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
            scope:
              - user:email
              - read:user

  mongodb:
    uri: ${MONGODB_URI}
    database: bankwise-db
    representation:
      uuid: STANDARD

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    model:
      embedding:
        text: google-genai

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: openai/gpt-oss-120b

    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001

    vectorstore:
      mongodb:
        collection-name: bankwise_vectors
        initialize-schema: false
        metadata-fields-to-filter: knowledgeBaseId,documentId,chunkId,chunkIndex

server:
  port: ${PORT:8080}

bankwise:
  storage:
    document-path: ${DOCUMENT_STORAGE_PATH:./storage/documents}
  document:
    max-file-size: 10485760
    chunking:
      chunk-size: 1000
      overlap: 200
  rag:
    retrieval:
      top-k: 5
      similarity-threshold: 0.70
      max-context-characters: 12000

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:NGE1ZThjMWY5ZDNiMmE0ZTZmOGMwYjJkNGU2ZjhhMGIxYzNkNWU3ZjlhMmI0YzZkOGUwZjFhM2I1YzdkOWUxZg==}
      expiration: 14400000
    oauth2:
      authorized-redirect-uris:
        - ${APP_OAUTH2_AUTHORIZED_REDIRECT_URI:https://bankwise-assitance.vercel.app/oauth2/redirect}
        - https://bankwise-assitance.vercel.app/oauth2/redirect
        - http://localhost:3000/oauth2/redirect
        - http://127.0.0.1:3000/oauth2/redirect
      default-redirect-uri: ${APP_OAUTH2_DEFAULT_REDIRECT_URI:https://bankwise-assitance.vercel.app/oauth2/redirect}
